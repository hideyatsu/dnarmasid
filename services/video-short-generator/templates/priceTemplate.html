<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap');
  
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body, html {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: transparent;
    font-family: 'Montserrat', sans-serif;
  }
  
  .price-container {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 60px;
  }
  
  .price-date {
    position: absolute;
    top: 80px;
    left: 60px;
    font-size: 32px;
    font-weight: 600;
    color: #B89965;
    text-shadow: 0 2px 6px rgba(0,0,0,0.5);
  }
  
  .price-brand {
    position: absolute;
    top: 80px;
    right: 60px;
    font-size: 28px;
    font-weight: 800;
    color: #D4AF37;
    text-shadow: 0 2px 6px rgba(0,0,0,0.5);
    letter-spacing: 2px;
  }
  
  .price-card {
    background: rgba(255, 255, 255, 0.95);
    border-radius: 32px;
    padding: 54px 64px;
    width: 880px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    backdrop-filter: blur(10px);
  }
  
  .price-header {
    text-align: center;
    margin-bottom: 40px;
  }
  
  .price-header h2 {
    font-size: 36px;
    font-weight: 600;
    color: #333;
    margin-bottom: 8px;
  }
  
  .price-header .gram {
    font-size: 28px;
    color: #888;
    font-weight: 400;
  }
  
  .price-main {
    text-align: center;
    margin-bottom: 40px;
  }
  
  .price-main .label {
    font-size: 28px;
    font-weight: 600;
    color: #888;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  
  .price-main .value {
    font-size: 80px;
    font-weight: 800;
    background: linear-gradient(135deg, #B89965 0%, #D4AF37 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  
  .price-divider {
    height: 2px;
    background: linear-gradient(90deg, transparent, #D4AF37, transparent);
    margin: 30px 0;
  }
  
  .price-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }
  
  .price-row .label {
    font-size: 32px;
    font-weight: 600;
    color: #555;
  }
  
  .price-row .value {
    font-size: 36px;
    font-weight: 800;
    color: #333;
  }
  
  .price-row .value.up {
    color: #2E7D32;
  }
  
  .price-row .value.down {
    color: #C62828;
  }
  
  .price-row .value.neutral {
    color: #888;
  }
  
  .price-delta {
    text-align: center;
    margin-top: 30px;
    padding: 20px;
    border-radius: 16px;
    background: #f5f5f5;
  }
  
  .price-delta .label {
    font-size: 24px;
    font-weight: 600;
    color: #888;
    margin-bottom: 8px;
  }
  
  .price-delta .value {
    font-size: 40px;
    font-weight: 800;
  }
  
  .price-delta .value.up {
    color: #2E7D32;
  }
  
  .price-delta .value.down {
    color: #C62828;
  }
  
  .price-delta .value.neutral {
    color: #888;
  }
</style>
</head>
<body>
  <div class="price-container">
    <div class="price-date">{{date}}</div>
    <div class="price-brand">DNARMASID</div>
    <div class="price-card">
      <div class="price-header">
        <h2>HARGA EMAS ANTAM</h2>
        <div class="gram">1 Gram</div>
      </div>
      
      <div class="price-main">
        <div class="label">Harga Jual</div>
        <div class="value">{{harga_jual}}</div>
      </div>
      
      <div class="price-divider"></div>
      
      <div class="price-row">
        <div class="label">Buyback</div>
        <div class="value">{{harga_buyback}}</div>
      </div>
      
      <div class="price-row">
        <div class="label">Spread</div>
        <div class="value">{{spread}}%</div>
      </div>
      
      <div class="price-delta">
        <div class="label">Perubahan dari Kemarin</div>
        <div class="value {{delta_class}}">{{delta_arrow}} {{delta}}</div>
      </div>
    </div>
  </div>
</body>
</html>
