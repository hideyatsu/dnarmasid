<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap');
  
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  
  body, html {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: transparent;
    font-family: 'Montserrat', sans-serif;
  }
  
  .hook-container {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 60px;
  }
  
  .hook-badge {
    font-size: 120px;
    margin-bottom: 40px;
    text-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  
  .hook-title {
    font-size: 72px;
    font-weight: 800;
    text-align: center;
    line-height: 1.3;
    background: linear-gradient(135deg, #B89965 0%, #D4AF37 50%, #F5E8D3 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: 0 2px 10px rgba(184, 153, 101, 0.3);
    margin-bottom: 30px;
  }
  
  .hook-subtitle {
    font-size: 42px;
    font-weight: 400;
    color: #FFFFFF;
    text-align: center;
    opacity: 0.9;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }
  
  .hook-date {
    position: absolute;
    top: 80px;
    left: 60px;
    font-size: 32px;
    font-weight: 600;
    color: #B89965;
    text-shadow: 0 2px 6px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>
  <div class="hook-container">
    <div class="hook-date">{{date}}</div>
    <div class="hook-badge">{{badge}}</div>
    <div class="hook-title">{{title}}</div>
    <div class="hook-subtitle">{{subtitle}}</div>
  </div>
</body>
</html>
