<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap');
  
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body, html {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: transparent;
    font-family: 'Montserrat', sans-serif;
  }
  
  .cta-container {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 60px;
    gap: 40px;
  }
  
  .cta-brand {
    font-size: 42px;
    font-weight: 800;
    letter-spacing: 6px;
    color: #D4AF37;
    text-shadow: 0 2px 12px rgba(0,0,0,0.5);
  }
  
  .cta-divider {
    width: 120px;
    height: 4px;
    background: linear-gradient(90deg, transparent, #D4AF37, transparent);
  }
  
  .cta-headline {
    font-size: 56px;
    font-weight: 800;
    text-align: center;
    line-height: 1.3;
    color: #FFFFFF;
    text-shadow: 0 2px 12px rgba(0,0,0,0.6);
    max-width: 800px;
  }
  
  .cta-subtext {
    font-size: 32px;
    font-weight: 400;
    text-align: center;
    color: #F5E8D3;
    opacity: 0.9;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    max-width: 700px;
    line-height: 1.5;
  }
  
  .cta-arrow {
    margin-top: 20px;
    font-size: 64px;
    color: #D4AF37;
    animation: bounce 1s infinite;
  }
  
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-20px); }
  }
</style>
</head>
<body>
  <div class="cta-container">
    <div class="cta-brand">DNARMASID</div>
    <div class="cta-divider"></div>
    <div class="cta-headline">Update Harga Emas Setiap Hari</div>
    <div class="cta-subtext">Dapatkan notifikasi harga harian, tips investasi, & insight pasar langsung di Telegram Anda.</div>
    <div class="cta-arrow">👇</div>
  </div>
</body>
</html>
